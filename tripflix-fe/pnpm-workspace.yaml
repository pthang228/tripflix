packages:
  - apps/*
  - packages/*

# Mọi package dùng "catalog:" để cả repo chung một phiên bản.
# react, react-dom phải đúng bản mà Expo SDK của apps/mobile yêu cầu (Expo SDK 58 → React 19.3.0).
catalog:
  '@tanstack/react-query': ^5.105.3
  '@tailwindcss/postcss': ^4.3.4
  '@types/node': ^24.0.0
  '@types/react': ~19.3.0
  '@types/react-dom': ~19.3.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  next: ^16.4.5
  orval: ^8.46.0
  oxlint: ^1.91.0
  prettier: ^3.9.10
  react: 19.3.0
  react-dom: 19.3.0
  tailwind-merge: ^3.4.0
  tailwindcss: ^4.3.4
  turbo: ^2.11.10
  typescript: 6.0.3
  vitest: ^4.1.12
  zod: ^4.6.7
