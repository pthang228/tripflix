[project]
name = "tripflix-ai"
version = "0.1.0"
description = "AI service for Tripflix"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pyright>=1.1.390,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["app", "tests"]
